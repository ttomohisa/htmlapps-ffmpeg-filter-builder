name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Check inline template script syntax
        shell: pwsh
        run: node ./tests/template-script-syntax-smoke.mjs

      - name: Test Graph Core / Compiler
        shell: pwsh
        run: node ./tests/graph-core-smoke.mjs

      - name: Test Preview Engine
        shell: pwsh
        run: node ./tests/preview-engine-smoke.mjs

      - name: Test Video Filter Set
        shell: pwsh
        run: node ./tests/video-filter-set-smoke.mjs

      - name: Test Complex Filtergraph
        shell: pwsh
        run: node ./tests/complex-filtergraph-smoke.mjs

      - name: Test Audio Filter Set
        shell: pwsh
        run: node ./tests/audio-filter-set-smoke.mjs

      - name: Test Text / Draw Text
        shell: pwsh
        run: node ./tests/text-filter-set-smoke.mjs

      - name: Test Recipes / Full Render
        shell: pwsh
        run: node ./tests/recipes-full-render-smoke.mjs

      - name: Test JA / EN parity
        shell: pwsh
        run: node ./tests/i18n-smoke.mjs

      - name: Test v1.2.0 workspace core
        shell: pwsh
        run: node ./tests/workspace-core-smoke.mjs
      - name: Modern node UI smoke test
        run: node ./tests/modern-node-ui-smoke.mjs

      - name: Floating workspace smoke test
        run: node ./tests/workspace-layout-polish-smoke.mjs

      - name: Manual layout and selection smoke test
        run: node ./tests/manual-layout-selection-smoke.mjs

      - name: Palette and Inspector smoke test
        run: node ./tests/palette-inspector-smoke.mjs

      - name: Connection UX and MiniMap smoke test
        run: node ./tests/connection-minimap-smoke.mjs

      - name: Mobile Graph Workspace smoke test
        run: node ./tests/mobile-workspace-smoke.mjs

      - name: Multi Input schema v4 migration smoke test
        run: node ./tests/multi-input-schema-smoke.mjs

      - name: Multiple Input node UI smoke test
        run: node ./tests/multi-input-ui-smoke.mjs

      - name: Canvas Drop and Missing Input smoke test
        run: node ./tests/multi-input-drop-smoke.mjs

      - name: Multi-input FFmpeg Compiler smoke test
        run: node ./tests/multi-input-compiler-smoke.mjs

      - name: Multi-input Preview / Full Render runtime contract
        run: node ./tests/multi-input-runtime-smoke.mjs

      - name: Local Builder integration smoke test
        run: node ./tests/local-runtime-integration-smoke.mjs

      - name: PowerShell SHA-256 compatibility smoke test
        run: node ./tests/powershell-hash-compat-smoke.mjs

      - name: Two-video Picture in Picture smoke test
        run: node ./tests/beta1-pip-smoke.mjs

      - name: MP4 track detection smoke test
        run: node ./tests/mp4-track-detection-smoke.mjs

      - name: Image Input and Logo Overlay smoke test
        run: node ./tests/beta2-logo-overlay-smoke.mjs

      - name: Audio Input / BGM / Audio Mix smoke test
        run: node ./tests/beta3-audio-bgm-smoke.mjs

      - name: Graph Restore / Auto Relink smoke test
        run: node ./tests/beta4-auto-relink-smoke.mjs

      - name: Stable release regression gate
        run: node ./tests/stable-release-smoke.mjs

      - name: Baseline regression smoke test
        run: node ./tests/release-smoke.mjs

      - name: Runtime cache repair smoke test
        run: node ./tests/runtime-cache-repair-smoke.mjs

      - name: Test media source lifecycle and filename regressions
        run: node ./tests/source-safety-regression.test.mjs
      - name: Test Graph restore and recipe source identity
        run: node ./tests/deep-source-restore-regression.test.mjs
      - name: Test dialog layout, dismissal focus, and app metadata
        shell: pwsh
        run: node --test ./tests/dialog-layout-focus.test.mjs ./tests/release-metadata.test.mjs

      - name: Build ST and MT standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1

      - name: Test generated header localization
        shell: pwsh
        run: node ./tests/header-normalization.test.mjs src/index.template.html dist/index.html dist/index.mt.html

      - name: Test reviewed runtime pins and loader guards
        shell: pwsh
        run: node ./tests/runtime-1.10.2.test.mjs

      - name: Prepare GitHub Pages site
        shell: pwsh
        run: ./scripts/prepare-pages.ps1

      - name: Test GitHub Pages ST/MT layout
        shell: pwsh
        run: node ./tests/pages-deployment-smoke.mjs

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Warning "GitHub Pages is not enabled. Build artifacts are still available."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-filter-builder-${{ github.sha }}
          path: |
            ffmpeg-filter-builder.html
            ffmpeg-filter-builder.mt.html
            dist/index.self-extract.html
            dist/index.mt.self-extract.html
            dist/runtime-manifest*.json
            dist/build-size-report*.json
            pages-dist/mt/index.html
            pages-dist/mt/coi-serviceworker.js
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Tag and publish verified standalone release
    needs: [build, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact built commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check version tag and existing GitHub Release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.config.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app.config.json must contain a stable SemVer release version."
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already references $tag_sha, not built commit $GITHUB_SHA."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the tested ST and MT standalone artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-filter-builder-${{ github.sha }}
          path: release-input

      - name: Package standalone HTML variants and checksums
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          base="htmlapps-ffmpeg-filter-builder-v$VERSION"
          test -s release-input/ffmpeg-filter-builder.html
          test -s release-input/ffmpeg-filter-builder.mt.html
          test -s release-input/dist/index.self-extract.html
          test -s release-input/dist/index.mt.self-extract.html
          test -s release-input/dist/runtime-manifest.json
          test -s release-input/dist/runtime-manifest.mt.json
          cp release-input/ffmpeg-filter-builder.html "release-assets/$base.html"
          cp release-input/ffmpeg-filter-builder.mt.html "release-assets/$base.mt.html"
          cp release-input/dist/index.self-extract.html "release-assets/$base.self-extract.html"
          cp release-input/dist/index.mt.self-extract.html "release-assets/$base.mt.self-extract.html"
          (
            cd release-assets
            zip -q -9 -j "$base.zip" ./*.html ../release-input/dist/runtime-manifest.json ../release-input/dist/runtime-manifest.mt.json
            sha256sum ./*.html ./*.zip > SHA256SUMS.txt
          )
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nRelease assets are built and tested from commit %s. Includes ST and MT standard/self-extracting HTML, ZIP and SHA-256 checksums.\n' "$GITHUB_SHA" >> release-notes.md

      - name: Create tag and publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg Filter Builder $TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
