# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Validate PowerShell syntax and encoding
      shell: powershell
      run: .\scripts\check-powershell-syntax.ps1
    - name: Test dialog layout, dismissal focus, and app metadata
      shell: pwsh
      run: node --test ./tests/dialog-layout-focus.test.mjs ./tests/release-metadata.test.mjs
    - name: Test MT preview navigation and isolation verifier
      shell: pwsh
      run: node --test ./tests/preview-isolation.test.mjs
    - name: Build ST and MT standalone HTML
      shell: pwsh
      run: ./build-standalone.ps1
    - name: Test generated header localization
      shell: pwsh
      run: node ./tests/header-normalization.test.mjs src/index.template.html dist/index.html dist/index.mt.html
    - name: Test reviewed runtime pins and loader guards
      shell: pwsh
      run: node ./tests/runtime-1.10.2.test.mjs
    - name: Prepare preview site
      shell: pwsh
      run: |
        ./scripts/prepare-pages.ps1
        node ./tests/pages-deployment-smoke.mjs

        $headers = @"
        /mt/*
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: require-corp
          Cross-Origin-Resource-Policy: same-origin
        "@

        [System.IO.File]::WriteAllText(
          (Join-Path $PWD "pages-dist\_headers"),
          $headers.TrimStart(),
          (New-Object System.Text.UTF8Encoding($false))
        )
    - name: Verify mobile layout source contracts
      shell: pwsh
      run: |
        node --test tests/mobile-layout.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Mobile layout source regression failed." }
    - name: Verify phone layout in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-layout-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path "test-results/mobile-layout" | Out-Null
        node scripts/mobile-layout.browser.cjs 2>&1 | Tee-Object -FilePath "test-results/mobile-layout/browser.log"
        if ($LASTEXITCODE -ne 0) { throw "Phone layout browser regression failed." }
    - name: Upload phone layout screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-layout-screenshots
        path: test-results/mobile-layout/
        if-no-files-found: ignore
        retention-days: 3
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: pages-dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
