name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "assets/favicon.svg"
      - "app.config.json"
      - "runtime.lock.json"
      - "font.lock.json"
      - "licenses/**"
      - "docs/RECIPES_FULL_RENDER.md"
      - "APP_SPEC.md"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Test Graph Core / Compiler
        shell: pwsh
        run: node ./tests/graph-core-smoke.mjs

      - name: Test Preview Engine
        shell: pwsh
        run: node ./tests/preview-engine-smoke.mjs

      - name: Test Video Filter Set
        shell: pwsh
        run: node ./tests/video-filter-set-smoke.mjs

      - name: Test Complex Filtergraph
        shell: pwsh
        run: node ./tests/complex-filtergraph-smoke.mjs

      - name: Test Audio Filter Set
        shell: pwsh
        run: node ./tests/audio-filter-set-smoke.mjs

      - name: Test Text / Draw Text
        shell: pwsh
        run: node ./tests/text-filter-set-smoke.mjs

      - name: Test Recipes / Full Render
        shell: pwsh
        run: node ./tests/recipes-full-render-smoke.mjs

      - name: Test JA / EN parity
        shell: pwsh
        run: node ./tests/i18n-smoke.mjs

      - name: Test v1.0.0 release UI / metadata
        shell: pwsh
        run: node ./tests/release-smoke.mjs

      - name: Build ST and MT standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-filter-builder-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.mt.html
            dist/index.self-extract.html
            dist/index.mt.self-extract.html
            dist/dependency-manifest.json
            dist/dependency-manifest.mt.json
            dist/runtime-manifest.json
            dist/runtime-manifest.mt.json
            dist/build-size-report.json
            dist/build-size-report.mt.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
